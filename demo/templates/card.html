<!doctype html>
<html lang="en" data-theme="{{theme}}">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 600; src: url("{{fonts}}/space-grotesk/space-grotesk-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("{{fonts}}/ibm-plex-sans/IBMPlexSans-Regular-Latin1.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("{{fonts}}/ibm-plex-sans/IBMPlexSans-SemiBold-Latin1.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("{{fonts}}/ibm-plex-mono/IBMPlexMono-Medium-Latin1.woff2") format("woff2"); }

:root {
  --font-display: "Space Grotesk", "IBM Plex Sans", sans-serif;
  --font-body: "IBM Plex Sans", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
  --radius-md: 4px;
}
:root[data-theme="dark"] {
  --bg: #0E1012; --surface: #15181B; --border: #2A2F35;
  --text: #E6E8EA; --text-secondary: #C3C8CD; --text-muted: #9AA1A9;
  --accent: #3FC1B0; --danger: #F2707F;
}
:root[data-theme="light"] {
  --bg: #F6F7F8; --surface: #FFFFFF; --border: #DDE1E5;
  --text: #15181B; --text-secondary: #3D444B; --text-muted: #5B636B;
  --accent: #0F7A6F; --danger: #B4233A;
}

* { box-sizing: border-box; margin: 0; }
html, body { width: {{width}}px; height: {{height}}px; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-body); font-weight: 400;
  display: grid; grid-template-rows: auto 1fr auto; padding: 44px 56px 40px;
}
.logo { height: 24px; width: auto; justify-self: start; }
main { display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.eyebrow { font-family: var(--font-mono); font-weight: 500; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 76px; line-height: 1.02; letter-spacing: -0.02em; }
.subtitle { font-size: 26px; line-height: 1.35; color: var(--text-secondary); max-width: 24em; }
.stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
.stat { padding: 18px 26px 22px; display: flex; flex-direction: column; gap: 6px; }
.stat + .stat { border-left: 1px solid var(--border); }
.stat-figure { font-family: var(--font-display); font-weight: 600; font-size: 56px; line-height: 1; letter-spacing: -0.02em; }
.stat-figure.bad { color: var(--danger); }
.stat-figure.good { color: var(--accent); }
.stat-label { font-size: 17px; line-height: 1.4; color: var(--text-secondary); }
p.note { font-size: 15px; line-height: 1.4; color: var(--text-muted); max-width: 52em; }
footer { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-weight: 500; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
footer .repo { text-transform: none; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <img class="logo" src="{{logo}}" alt="AOX">
  <main>
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{title}}</h1>
    <p class="subtitle">{{subtitle}}</p>
    <div class="stats">
      <div class="stat"><span class="stat-figure bad">{{statOff}}</span><span class="stat-label">hostile attacks succeed with every layer off</span></div>
      <div class="stat"><span class="stat-figure good">{{statOn}}</span><span class="stat-label">succeed with every layer on</span></div>
    </div>
    <p class="note">Attacker: a script that does what a planted text tells it, as a compliant model would. Classifier in replay mode.</p>
  </main>
  <footer>
    <span>{{sampleLabel}}</span>
    <span class="repo">{{repoUrl}}</span>
  </footer>
</body>
</html>
