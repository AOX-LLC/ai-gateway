<!doctype html>
<html lang="en" data-theme="{{theme}}">
<head>
<meta charset="utf-8">
<title>Claude Code transcript</title>
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 600; src: url("{{fonts}}/space-grotesk/space-grotesk-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("{{fonts}}/ibm-plex-sans/IBMPlexSans-Regular-Latin1.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("{{fonts}}/ibm-plex-sans/IBMPlexSans-SemiBold-Latin1.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("{{fonts}}/ibm-plex-mono/IBMPlexMono-Regular-Latin1.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("{{fonts}}/ibm-plex-mono/IBMPlexMono-Medium-Latin1.woff2") format("woff2"); }

:root {
  --font-display: "Space Grotesk", "IBM Plex Sans", sans-serif;
  --font-body: "IBM Plex Sans", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}
:root[data-theme="dark"] {
  --bg: #0E1012; --surface: #15181B; --surface-muted: #1C2024; --border: #2A2F35;
  --text: #E6E8EA; --text-secondary: #C3C8CD; --text-muted: #9AA1A9;
  --accent: #3FC1B0; --danger: #F2707F; --danger-soft: #33161B; --warning: #E8B23A; --warning-soft: #2E2410;
  --success: #4CC985;
}
:root[data-theme="light"] {
  --bg: #F6F7F8; --surface: #FFFFFF; --surface-muted: #F0F2F4; --border: #DDE1E5;
  --text: #15181B; --text-secondary: #3D444B; --text-muted: #5B636B;
  --accent: #0F7A6F; --danger: #B4233A; --danger-soft: #FBE7EA; --warning: #8A5A00; --warning-soft: #FDF3DC;
  --success: #1E7A44;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1440px; height: 900px; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); display: grid; grid-template-rows: 56px auto 1fr auto; }
header { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; }
.brand img { height: 20px; }
.divider { width: 1px; height: 20px; background: var(--border); }
.pill { font-family: var(--font-mono); font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--border); border-radius: 2px; background: var(--surface-muted); color: var(--text-secondary); }
.fictional { font-size: 14px; color: var(--text-secondary); }
.banner { padding: 14px 24px; font-size: 18px; line-height: 1.4; border-bottom: 1px solid var(--border); }
.banner b { font-family: var(--font-mono); font-weight: 500; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; margin-right: 12px; }
.banner.realistic { background: var(--surface-muted); color: var(--text); }
.banner.realistic b { color: var(--accent); }
.banner.compliant { background: var(--warning-soft); color: var(--text); }
.banner.compliant b { color: var(--warning); }
main { padding: 22px 24px 0; overflow: hidden; }
#term { height: 100%; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 18px 22px; font-family: var(--font-mono); font-size: 18px; line-height: 1.5; display: flex; flex-direction: column; justify-content: flex-end; }
#term div { white-space: pre-wrap; }
.dim { color: var(--text-muted); }
.prompt { color: var(--accent); }
.call { color: var(--text); }
.result { color: var(--text-muted); padding-left: 3ch; }
.blocked { color: var(--danger); background: var(--danger-soft); padding: 2px 10px 2px 3ch; margin: 2px 0; border-left: 3px solid var(--danger); font-weight: 500; }
.error { color: var(--warning); padding-left: 3ch; }
.folded { color: var(--text-muted); font-style: italic; padding-left: 3ch; }
.claude { color: var(--text); font-family: var(--font-body); font-size: 19px; }
.answer { color: var(--text); font-family: var(--font-body); font-size: 19px; padding-left: 3ch; }
footer { padding: 12px 24px 16px; font-family: var(--font-mono); font-size: 14px; color: var(--text-secondary); letter-spacing: .02em; }
footer .bad { color: var(--danger); font-weight: 500; }
</style>
</head>
<body>
  <header>
    <div class="brand"><img src="{{logo}}" alt="AOX"><span class="divider"></span><span>Claude Code · transcript of a real run</span><span class="pill">Sample data</span></div>
    <span class="fictional">Harborline Supply Co. (fictional)</span>
  </header>
  <div class="banner {{kind}}"><b>{{kindTitle}}</b>{{label}}</div>
  <main><div id="term"></div></main>
  <footer id="summary">&nbsp;</footer>
</body>
</html>
