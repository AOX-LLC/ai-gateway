[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-gateway"
version = "0.1.1"
description = "Zero-trust gateway between AI clients and MCP tools."
authors = [{ name = "AOX LLC" }]
requires-python = ">=3.12"
dependencies = [
    "mcp-common",
    "mcp==2.2.0",
    "httpx2>=2.13,<3",
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.13,<3",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "aox-agent-core[postgres]",
    "jsonschema>=4.23,<5",
]

[project.scripts]
ai-gateway = "ai_gateway.__main__:main"
gateway-admin = "ai_gateway.admin.cli:main"
gateway-approver = "ai_gateway.approver.cli:main"
telemetry-purge = "ai_gateway.telemetry.purge:main"
approvals-purge = "ai_gateway.policy.purge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway"]

[tool.uv.sources]
mcp-common = { workspace = true }
# Pinned by tag: v0.1.0 has the async storage, idempotent approvals, audit schema 4 and login binding this gateway uses.
aox-agent-core = { git = "https://github.com/AOX-LLC/agent-core", tag = "v0.1.0" }
