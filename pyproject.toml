[project]
name = "ai-gateway-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["ai-gateway"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.16.10",
    "pre-commit>=3.6",
    "echo-server",
    "mcp-common",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["gateway", "servers/*"]

[tool.uv.sources]
ai-gateway = { workspace = true }
echo-server = { workspace = true }
mcp-common = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["gateway/src", "gateway/tests", "servers/echo/src", "servers/common/src", "scripts"]

[tool.ruff.lint]
select = [
    "ASYNC", # async pitfalls
    "B",     # bugbear
    "C4",    # comprehensions
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # import order
    "N",     # naming
    "PT",    # pytest style
    "RET",   # return statements
    "RUF",   # ruff-specific
    "S",     # bandit security checks
    "SIM",   # simplifications
    "TID",   # tidy imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603"]
"scripts/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["gateway/src", "gateway/tests", "servers/echo/src", "servers/common/src", "scripts"]
plugins = ["pydantic.mypy"]
mypy_path = "gateway/src:servers/echo/src:servers/common/src"
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["gateway/tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
markers = ["integration: needs the Postgres test database (GATEWAY_TEST_DATABASE_URL)"]
