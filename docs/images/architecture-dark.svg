<rect x="334" y="444" width="562" height="56" rx="6" fill="#12302C" stroke="#3FC1B0" stroke-width="1.5"/>
<text x="350" y="469" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#E6E8EA" text-anchor="start">One decision record per request</text>
