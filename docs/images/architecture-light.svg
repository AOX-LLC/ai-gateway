<text x="546" y="316" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="500" fill="#15181B" text-anchor="middle">canary</text>
<rect x="618" y="292" width="124" height="38" rx="4" fill="#F0F2F4" stroke="#C5CBD1" stroke-width="1.5"/>
<text x="680" y="316" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="500" fill="#15181B" text-anchor="middle">classifier</text>
