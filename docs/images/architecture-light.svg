<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 696" width="1240" height="696" role="img" aria-labelledby="t d">
<title id="t">AI Gateway architecture</title>
<desc id="d">AI clients connect with a bearer token to the gateway, which runs a fixed pipeline of layers before and after each call to the upstream MCP servers on an internal network. Decisions, approvals and telemetry go to PostgreSQL; a read-only dashboard shows them and a person approves writes. Harborline Supply Co. and its data are fictional.</desc>
<rect width="1240" height="696" fill="#F6F7F8"/>
<rect x="24" y="150" width="210" height="250" rx="6" fill="#FFFFFF" stroke="#C5CBD1" stroke-width="1.5"/>
<text x="129" y="184" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="500" fill="#5B636B" text-anchor="middle" letter-spacing="1">AI CLIENTS</text>
<text x="129" y="222" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#15181B" text-anchor="middle">Claude Code,</text>
<text x="129" y="244" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#15181B" text-anchor="middle">agents, apps</text>
<text x="129" y="284" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#3D444B" text-anchor="middle">MCP over HTTP</text>
<text x="129" y="306" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#3D444B" text-anchor="middle">one bearer token</text>
<text x="129" y="328" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#3D444B" text-anchor="middle">per client, scoped</text>
<text x="129" y="368" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#5B636B" text-anchor="middle">the client may be steered</text>
<text x="129" y="388" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#5B636B" text-anchor="middle">by text it reads</text>
<rect x="310" y="40" width="610" height="520" rx="6" fill="#FFFFFF" stroke="#0F7A6F" stroke-width="1.5"/>
<text x="334" y="76" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="500" fill="#0F7A6F" text-anchor="start" letter-spacing="1">AI GATEWAY</text>
<text x="334" y="100" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#15181B" text-anchor="start">Every call is checked in a fixed order, in and out</text>
<rect x="334" y="118" width="168" height="38" rx="4" fill="#F0F2F4" stroke="#C5CBD1" stroke-width="1.5"/>
<text x="418" y="142" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="500" fill="#15181B" text-anchor="middle">bearer auth</text>
<rect x="514" y="118" width="168" height="38" rx="4" fill="#F0F2F4" stroke="#C5CBD1" stroke-width="1.5"/>
<text x="598" y="142" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="500" fill="#15181B" text-anchor="middle">protocol guard</text>
<text x="698" y="134" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#5B636B" text-anchor="start">always on: no setting</text>
<text x="698" y="151" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#5B636B" text-anchor="start">turns them off</text>
