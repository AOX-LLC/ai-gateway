<text x="680" y="388" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="500" fill="#15181B" text-anchor="middle">classifier</text>
<text x="350" y="416" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#5B636B" text-anchor="start">tools/list is filtered by scope and pinned descriptions</text>
<rect x="334" y="444" width="562" height="56" rx="6" fill="#E3F2EF" stroke="#0F7A6F" stroke-width="1.5"/>
<text x="350" y="469" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#15181B" text-anchor="start">One decision record per request</text>
<text x="350" y="488" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#3D444B" text-anchor="start">which layer decided, how long it took; never the arguments or the results</text>
<text x="334" y="530" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#5B636B" text-anchor="start">A write waits for a person; the arguments forwarded are the ones every layer saw.</text>
