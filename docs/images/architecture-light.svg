<text x="998" y="352" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#15181B" text-anchor="start">Harborline Supply Co.</text>
<text x="998" y="372" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#3D444B" text-anchor="start">(fictional), synthetic data</text>
<text x="998" y="396" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#5B636B" text-anchor="start">each with its own role</text>
<rect x="310" y="600" width="610" height="84" rx="6" fill="#FFFFFF" stroke="#C5CBD1" stroke-width="1.5"/>
<text x="334" y="628" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="500" fill="#5B636B" text-anchor="start" letter-spacing="1">POSTGRESQL + PGVECTOR</text>
<text x="334" y="652" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#15181B" text-anchor="start">policy · approvals · audit log · telemetry</text>
<text x="334" y="672" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#3D444B" text-anchor="start">a separate database role for the gateway, the approver and the dashboard</text>
