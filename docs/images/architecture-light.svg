<text x="350" y="358" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#3D444B" text-anchor="start">after the call, on the result</text>
<rect x="350" y="368" width="124" height="30" rx="4" fill="#F0F2F4" stroke="#C5CBD1" stroke-width="1.5"/>
<text x="412" y="388" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="500" fill="#15181B" text-anchor="middle">egress</text>
