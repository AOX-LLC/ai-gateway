<text x="350" y="202" font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="500" fill="#5B636B" text-anchor="start" letter-spacing="1">PIPELINE  ·  each layer: enforce, monitor or off</text>
<text x="350" y="232" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#3D444B" text-anchor="start">before the call</text>
