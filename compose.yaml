name: ai-gateway

# One image serves migrate, gateway and admin. GIT_COMMIT and GIT_BRANCH end up on
# /healthz; export them before building, e.g.
#   GIT_COMMIT=$(git rev-parse --short HEAD) GIT_BRANCH=$(git branch --show-current) docker compose build
x-gateway-build: &gateway-build
  context: .
  dockerfile: gateway/Dockerfile
  args:
    GIT_COMMIT: ${GIT_COMMIT:-}
    GIT_BRANCH: ${GIT_BRANCH:-}

# One image serves the setup one-shot and every MCP server (all of Harborline Supply Co.,
# a fictional company), and carries the handbook's embedding model.
x-servers-build: &servers-build
  context: .
  dockerfile: servers/Dockerfile
  args:
    GIT_COMMIT: ${GIT_COMMIT:-}
    GIT_BRANCH: ${GIT_BRANCH:-}

# Two networks. `edge` is an ordinary bridge: the services that publish a port on 127.0.0.1
# (the gateway and Postgres) are on it. `backend` is internal: Docker gives it no route to the
# outside world and publishes no port from it, so a service that sits only on `backend` can
# reach its neighbours and nothing else. The MCP servers, the one-shots and the test upstream
# are there only, which is why the servers publish no port: a prompt-injected or compromised
# server has nowhere to send what it read. The gateway is on both, so it can be reached from
# the host and can reach the servers.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
      GATEWAY_APP_DB_PASSWORD: ${GATEWAY_APP_DB_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:4402:5432"
    networks: [edge, backend]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: *gateway-build
    image: ai-gateway-gateway
    command: ["gateway-admin", "migrate"]
    <<: *hardening
    networks: [backend]
    environment:
      GATEWAY_MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    build: *gateway-build
    image: ai-gateway-gateway
    command: ["ai-gateway"]
    restart: unless-stopped
    environment:
      GATEWAY_BIND: 0.0.0.0
      GATEWAY_PORT: "4401"
      GATEWAY_DATABASE_URL: postgresql://gateway_app:${GATEWAY_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GATEWAY_PIPELINE_FILE: ${GATEWAY_PIPELINE_FILE_IN_CONTAINER:-/app/config/pipeline.toml}
      GATEWAY_ALLOWED_HOSTS: ${GATEWAY_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      # The gateway presents these to the servers (upstream_servers.credential_env).
      TICKETING_SERVICE_TOKEN: ${TICKETING_SERVICE_TOKEN:?set it in .env}
      CRM_SERVICE_TOKEN: ${CRM_SERVICE_TOKEN:?set it in .env}
      HANDBOOK_SERVICE_TOKEN: ${HANDBOOK_SERVICE_TOKEN:?set it in .env}
    ports:
      - "127.0.0.1:4401:4401"
    networks: [edge, backend]
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4401/healthz", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *hardening

  # Runs as the database owner: creates each server's role and schema, migrates and seeds
  # them. The servers themselves connect only as their own least-privilege role.
  servers-setup:
    build: *servers-build
    image: harborline-servers
    command: ["harborline-setup"]
    <<: *hardening
    networks: [backend]
    environment:
      HARBORLINE_SETUP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TICKETING_DB_PASSWORD: ${TICKETING_DB_PASSWORD:?set it in .env}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:?set it in .env}
      HANDBOOK_DB_PASSWORD: ${HANDBOOK_DB_PASSWORD:?set it in .env}
      HANDBOOK_DOCUMENTS_PATH: /handbook-documents
    # The handbook's documents, restricted ones included, are in no image: .dockerignore keeps
    # them out of the build, and only this one-shot sees them, mounted read-only.
    volumes:
      - ./servers/handbook/documents:/handbook-documents:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ticketing:
    build: *servers-build
    image: harborline-servers
    command: ["ticketing-server"]
    restart: unless-stopped
    environment:
      TICKETING_BIND: 0.0.0.0
      TICKETING_PORT: "4412"
      TICKETING_DATABASE_URL: postgresql://ticketing_app:${TICKETING_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TICKETING_SERVICE_TOKEN: ${TICKETING_SERVICE_TOKEN:?set it in .env}
      TICKETING_ALLOWED_HOSTS: ticketing:*,127.0.0.1:*,localhost:*
    networks: [backend]
    depends_on:
      servers-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4412/healthz", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *hardening

  crm:
    build: *servers-build
    image: harborline-servers
    command: ["crm-server"]
    restart: unless-stopped
    environment:
      CRM_BIND: 0.0.0.0
      CRM_PORT: "4411"
      CRM_DATABASE_URL: postgresql://crm_app:${CRM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CRM_SERVICE_TOKEN: ${CRM_SERVICE_TOKEN:?set it in .env}
      CRM_ALLOWED_HOSTS: crm:*,127.0.0.1:*,localhost:*
    networks: [backend]
    depends_on:
      servers-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4411/healthz", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *hardening

  # Loads the embedding model baked into the image (HANDBOOK_MODEL_PATH); no network needed.
  handbook:
    build: *servers-build
    image: harborline-servers
    command: ["handbook-server"]
    restart: unless-stopped
    environment:
      HANDBOOK_BIND: 0.0.0.0
      HANDBOOK_PORT: "4410"
      HANDBOOK_DATABASE_URL: postgresql://handbook_app:${HANDBOOK_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HANDBOOK_SERVICE_TOKEN: ${HANDBOOK_SERVICE_TOKEN:?set it in .env}
      HANDBOOK_ALLOWED_HOSTS: handbook:*,127.0.0.1:*,localhost:*
    networks: [backend]
    depends_on:
      servers-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4410/healthz", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *hardening

  admin:
    profiles: [tools]
    build: *gateway-build
    image: ai-gateway-gateway
    entrypoint: ["gateway-admin"]
    <<: *hardening
    networks: [backend]
    environment:
      GATEWAY_MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  # Runs scripts/test_client.py in the servers' own network. The servers publish no port, so
  # the host cannot call them directly; scripts/direct_check.sh runs this once per server.
  direct-check:
    profiles: [tools]
    build: *servers-build
    image: harborline-servers
    entrypoint: ["python", "/scripts/test_client.py"]
    <<: *hardening
    networks: [backend]
    environment:
      TICKETING_SERVICE_TOKEN: ${TICKETING_SERVICE_TOKEN:?set it in .env}
      CRM_SERVICE_TOKEN: ${CRM_SERVICE_TOKEN:?set it in .env}
      HANDBOOK_SERVICE_TOKEN: ${HANDBOOK_SERVICE_TOKEN:?set it in .env}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      ticketing:
        condition: service_healthy
      crm:
        condition: service_healthy
      handbook:
        condition: service_healthy

  echo:
    profiles: [test]
    build:
      context: .
      dockerfile: servers/echo/Dockerfile
    environment:
      ECHO_HOST: 0.0.0.0
      ECHO_PORT: "8000"
      ECHO_ALLOWED_HOSTS: echo:*,127.0.0.1:*
    <<: *hardening
    networks: [backend]

networks:
  edge: {}
  backend:
    internal: true

volumes:
  postgres-data:
