name: ai-gateway

# One image serves migrate, gateway and admin. GIT_COMMIT and GIT_BRANCH end up on
# /healthz; export them before building, e.g.
#   GIT_COMMIT=$(git rev-parse --short HEAD) GIT_BRANCH=$(git branch --show-current) docker compose build
x-gateway-build: &gateway-build
  context: .
  dockerfile: gateway/Dockerfile
  args:
    GIT_COMMIT: ${GIT_COMMIT:-}
    GIT_BRANCH: ${GIT_BRANCH:-}

# One image serves the setup one-shot and every MCP server (all of Harborline Supply Co.,
# a fictional company), and carries the handbook's embedding model.
x-servers-build: &servers-build
  context: .
  dockerfile: servers/Dockerfile
  args:
    GIT_COMMIT: ${GIT_COMMIT:-}
    GIT_BRANCH: ${GIT_BRANCH:-}

# Two networks. `edge` is an ordinary bridge: the services that publish a port on 127.0.0.1
# (the gateway and Postgres) are on it. `backend` is internal: Docker gives it no route to the
# outside world and publishes no port from it, and (inhibit_ipv4, below) the host has no
# address on it, so a service that sits only on `backend` reaches its neighbours and nothing
# else, not the Internet and not the host's own listeners. The MCP servers, the one-shots and
# the test upstream are there only, which is why the servers publish no port: a
# prompt-injected or compromised server has nowhere to send what it read. The gateway and
# Postgres are on both, so the host can reach them and they can reach the servers. Postgres
# can itself open outbound connections for a superuser (see docs/architecture.md, Networks).
# Memory limits (mem_limit on every service) are sized for a shared 4-core, 7 GB machine, at about
# 1.5 times each long-running service's peak, in steps of 16 MiB, with floors of 64 MiB for a small
# service and 256 for Postgres. The peaks are the cgroup's own (`memory.peak`) after a cold start and
# the loads of scripts/measure_memory_at_maxima.py (Phase 4d): forty concurrent sessions paging every
# read tool at the largest page, oversize arguments, thirty writes held for approval, and about five
# thousand calls in a minute, the layers that can be weakened in monitor mode so nothing is throttled
# first. Measured: gateway 175 MiB (it was limited to 176 and sat at the limit: the classifier, the
# egress ledgers and agent-core took what the 115 MiB of Phase 3c did not), handbook 138, ticketing
# and CRM 83 each, Postgres 145 to 152, approvals-purge 72, telemetry-purge 29. The dashboard keeps the
# limit scripts/measure_dashboard_memory.py gave it (144, Phase 5c-3). The one-shots (the setups,
# admin, migrate) exit before a peak can be read and keep the limits of Phase 3c; servers-setup embeds
# the handbook with a local model on a fresh volume and keeps 384. The approver and the lab approver
# were not run in these loads and keep generous limits. All limits together are 2.7 GiB;
# gateway/tests/test_compose.py keeps the total under 3072 MiB.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
      GATEWAY_APP_DB_PASSWORD: ${GATEWAY_APP_DB_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:4402:5432"
    # On the dashboard's own network too, so the dashboard reaches the database and nothing else.
    networks: [edge, backend, dashboard]
    mem_limit: 256m
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: *gateway-build
    image: ai-gateway-gateway
    command: ["gateway-admin", "migrate"]
    <<: *hardening
    networks: [backend]
    mem_limit: 144m
    environment:
      GATEWAY_MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Creates the telemetry schema's three roles, migrates and grants (as the database owner).
  telemetry-setup:
    build: *gateway-build
    image: ai-gateway-gateway
    command: ["gateway-admin", "telemetry-setup"]
    <<: *hardening
    networks: [backend]
    mem_limit: 160m
    environment:
      GATEWAY_MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TELEMETRY_WRITER_DB_PASSWORD: ${TELEMETRY_WRITER_DB_PASSWORD:?set it in .env}
      TELEMETRY_READER_DB_PASSWORD: ${TELEMETRY_READER_DB_PASSWORD:?set it in .env}
      TELEMETRY_PURGER_DB_PASSWORD: ${TELEMETRY_PURGER_DB_PASSWORD:?set it in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Creates the policy schema's roles (the approver role is a group nobody logs in as: each approver
  # has a login of their own, made by `admin approver-add`), installs agent-core's audit log and approval queue
  # once, and grants (as the database owner).
  policy-setup:
    build: *gateway-build
    image: ai-gateway-gateway
    command: ["gateway-admin", "policy-setup"]
    <<: *hardening
    networks: [backend]
    mem_limit: 144m
    environment:
      GATEWAY_MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POLICY_GATEWAY_DB_PASSWORD: ${POLICY_GATEWAY_DB_PASSWORD:?set it in .env}
      POLICY_AUDITOR_DB_PASSWORD: ${POLICY_AUDITOR_DB_PASSWORD:?set it in .env}
      POLICY_PURGER_DB_PASSWORD: ${POLICY_PURGER_DB_PASSWORD:?set it in .env}
      # Empty (the default): there is no lab approver role. Set it to create one for the lab profile.
      POLICY_LAB_APPROVER_DB_PASSWORD: ${POLICY_LAB_APPROVER_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      # After the telemetry roles exist: the dashboard's reader is granted the approvals view.
      telemetry-setup:
        condition: service_completed_successfully
    restart: "no"

  # Deletes telemetry past its retention (spans 7 days, everything else 30 by default), hourly,
  # as a role that can delete rows and read nothing but their times.
  telemetry-purge:
    build: *gateway-build
    image: ai-gateway-gateway
    command: ["telemetry-purge", "--every", "3600"]
    restart: unless-stopped
    <<: *hardening
    networks: [backend]
    mem_limit: 64m
    environment:
      TELEMETRY_PURGE_DATABASE_URL: postgresql://telemetry_purger:${TELEMETRY_PURGER_DB_PASSWORD:?set it in .env}@postgres:5432/${POSTGRES_DB}
      TELEMETRY_RETENTION_SPAN_DAYS: ${TELEMETRY_RETENTION_SPAN_DAYS:-7}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-30}
    depends_on:
      telemetry-setup:
        condition: service_completed_successfully

  # Removes the arguments of finished approval requests 7 days after they finished, hourly, as a
  # login of its own: agent-core lets only the approver side purge a stored payload, so the gateway
  # never holds that right. The login is mapped to a principal that is not an approver.
  approvals-purge:
    build: *gateway-build
    image: ai-gateway-gateway
    command: ["approvals-purge", "--every", "3600"]
    restart: unless-stopped
    <<: *hardening
    networks: [backend]
    mem_limit: 112m
    environment:
      POLICY_PURGER_DATABASE_URL: postgresql://policy_payload_purger:${POLICY_PURGER_DB_PASSWORD:?set it in .env}@postgres:5432/${POSTGRES_DB}
    depends_on:
      policy-setup:
        condition: service_completed_successfully

  gateway:
    build: *gateway-build
    image: ai-gateway-gateway
    command: ["ai-gateway"]
    restart: unless-stopped
    environment:
      GATEWAY_BIND: 0.0.0.0
      GATEWAY_PORT: "4401"
      GATEWAY_DATABASE_URL: postgresql://gateway_app:${GATEWAY_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Each file can be pointed elsewhere for the red-team scorecard's lab gateway (config/lab/); every
      # default is the file that was named here before.
      GATEWAY_PIPELINE_FILE: ${GATEWAY_PIPELINE_FILE_IN_CONTAINER:-/app/config/pipeline.toml}
      GATEWAY_TOOL_PINS_FILE: ${GATEWAY_TOOL_PINS_FILE_IN_CONTAINER:-/app/config/tool_pins.toml}
      GATEWAY_APPROVAL_ROLES_FILE: ${GATEWAY_APPROVAL_ROLES_FILE_IN_CONTAINER:-/app/config/approval_roles.toml}
      GATEWAY_ALLOWLIST_FILE: ${GATEWAY_ALLOWLIST_FILE_IN_CONTAINER:-/app/config/allowlist.toml}
      GATEWAY_RATE_LIMITS_FILE: /app/config/rate_limits.toml
      GATEWAY_CLASSIFIER_FILE: ${GATEWAY_CLASSIFIER_FILE_IN_CONTAINER:-/app/config/classifier.toml}
      # How often the catalogue looks for a changed upstream definition (the scorecard shortens it).
      GATEWAY_CATALOG_REFRESH_S: ${GATEWAY_CATALOG_REFRESH_S:-60}
      # replay (the default) serves the committed recordings and needs no key. record or live need
      # AGENT_CORE_ANTHROPIC_API_KEY in .env, which only agent-core reads (it is empty by default).
      AGENT_CORE_MODE: ${AGENT_CORE_MODE:-replay}
      AGENT_CORE_ANTHROPIC_API_KEY: ${AGENT_CORE_ANTHROPIC_API_KEY:-}
      GATEWAY_ARGUMENT_HASH_KEY: ${GATEWAY_ARGUMENT_HASH_KEY:?set it in .env}
      GATEWAY_ALLOWED_HOSTS: ${GATEWAY_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      # Spans and decision records are stored through this append-only role. If the database
      # cannot be reached the gateway still serves; /healthz then reports degraded telemetry.
      GATEWAY_TELEMETRY_DATABASE_URL: postgresql://telemetry_writer:${TELEMETRY_WRITER_DB_PASSWORD:?set it in .env}@postgres:5432/${POSTGRES_DB}
      # The audit log: the gateway appends through this role, which can read and append and,
      # through a guard on the approval table, cannot decide an approval. A write is refused when
      # its audit record cannot be written.
      GATEWAY_POLICY_DATABASE_URL: postgresql://policy_gateway:${POLICY_GATEWAY_DB_PASSWORD:?set it in .env}@postgres:5432/${POSTGRES_DB}
      # The gateway presents these to the servers (upstream_servers.credential_env).
      TICKETING_SERVICE_TOKEN: ${TICKETING_SERVICE_TOKEN:?set it in .env}
      CRM_SERVICE_TOKEN: ${CRM_SERVICE_TOKEN:?set it in .env}
      HANDBOOK_SERVICE_TOKEN: ${HANDBOOK_SERVICE_TOKEN:?set it in .env}
      # A floor layer can be weakened only with this on as well as allow_floor_override in the file
      # (the red-team lab: empty, so never, by default).
      LAB_FLOOR_OVERRIDE: ${LAB_FLOOR_OVERRIDE:-}
      # The lab upstream's credential, empty unless a scorecard run gives it (the lab profile only).
      LAB_UPSTREAM_SERVICE_TOKEN: ${LAB_UPSTREAM_TOKEN:-}
    ports:
      - "127.0.0.1:4401:4401"
    networks: [edge, backend]
    mem_limit: 272m
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      telemetry-setup:
        condition: service_completed_successfully
      policy-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4401/healthz", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *hardening

  # The dashboard (Phase 5c): read-only, on 127.0.0.1:4400, through the telemetry reader role. It is on
  # a network of its own with Postgres, not on `edge` with the gateway. The memory limit is 1.5 times the
  # highest peak measured by scripts/measure_dashboard_memory.py (94 MiB), the Node heap 60% of it. Sign in with the admin password: scripts/set_dashboard_password.py.
  dashboard:
    build: ./dashboard
    image: ai-gateway-dashboard
    restart: unless-stopped
    <<: *hardening
    tmpfs:
      - /tmp
      - /app/.next/cache
    networks: [dashboard]
    ports:
      - "127.0.0.1:4400:4400"
    mem_limit: 144m
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=86
      DASHBOARD_DATABASE_URL: postgresql://telemetry_reader:${TELEMETRY_READER_DB_PASSWORD:?set it in .env}@postgres:5432/${POSTGRES_DB}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:?set it in .env (python3 scripts/init_env.py adds it)}
      DASHBOARD_ADMIN_PASSWORD_HASH: ${DASHBOARD_ADMIN_PASSWORD_HASH:-}
      DASHBOARD_SAMPLE_DATA: ${DASHBOARD_SAMPLE_DATA:-1}
      # The Host values it answers to (anything else is refused: DNS rebinding); loopback by default.
      DASHBOARD_ALLOWED_HOSTS: ${DASHBOARD_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      # The reader role and the views it reads exist after these.
      telemetry-setup:
        condition: service_completed_successfully
      policy-setup:
        condition: service_completed_successfully

  # Runs as the database owner: creates each server's role and schema, migrates and seeds
  # them. The servers themselves connect only as their own least-privilege role.
  servers-setup:
    build: *servers-build
    image: harborline-servers
    command: ["harborline-setup"]
    <<: *hardening
    networks: [backend]
    mem_limit: 384m
    environment:
      HARBORLINE_SETUP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TICKETING_DB_PASSWORD: ${TICKETING_DB_PASSWORD:?set it in .env}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:?set it in .env}
      HANDBOOK_DB_PASSWORD: ${HANDBOOK_DB_PASSWORD:?set it in .env}
      HANDBOOK_DOCUMENTS_PATH: /handbook-documents
    # The handbook's documents, restricted ones included, are in no image: .dockerignore keeps
    # them out of the build, and only this one-shot sees them, mounted read-only.
    volumes:
      - ./servers/handbook/documents:/handbook-documents:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ticketing:
    build: *servers-build
    image: harborline-servers
    command: ["ticketing-server"]
    restart: unless-stopped
    environment:
      TICKETING_BIND: 0.0.0.0
      TICKETING_PORT: "4412"
      TICKETING_DATABASE_URL: postgresql://ticketing_app:${TICKETING_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TICKETING_SERVICE_TOKEN: ${TICKETING_SERVICE_TOKEN:?set it in .env}
      TICKETING_ALLOWED_HOSTS: ticketing:*,127.0.0.1:*,localhost:*
    networks: [backend]
    mem_limit: 128m
    depends_on:
      servers-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4412/healthz", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *hardening

  crm:
    build: *servers-build
    image: harborline-servers
    command: ["crm-server"]
    restart: unless-stopped
    environment:
      CRM_BIND: 0.0.0.0
      CRM_PORT: "4411"
      CRM_DATABASE_URL: postgresql://crm_app:${CRM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CRM_SERVICE_TOKEN: ${CRM_SERVICE_TOKEN:?set it in .env}
      CRM_ALLOWED_HOSTS: crm:*,127.0.0.1:*,localhost:*
    networks: [backend]
    mem_limit: 128m
    depends_on:
      servers-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4411/healthz", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *hardening

  # Loads the embedding model baked into the image (HANDBOOK_MODEL_PATH); no network needed.
  handbook:
    build: *servers-build
    image: harborline-servers
    command: ["handbook-server"]
    restart: unless-stopped
    environment:
      HANDBOOK_BIND: 0.0.0.0
      HANDBOOK_PORT: "4410"
      HANDBOOK_DATABASE_URL: postgresql://handbook_app:${HANDBOOK_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HANDBOOK_SERVICE_TOKEN: ${HANDBOOK_SERVICE_TOKEN:?set it in .env}
      HANDBOOK_ALLOWED_HOSTS: handbook:*,127.0.0.1:*,localhost:*
    networks: [backend]
    mem_limit: 208m
    depends_on:
      servers-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4410/healthz", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *hardening

  admin:
    profiles: [tools]
    build: *gateway-build
    image: ai-gateway-gateway
    entrypoint: ["gateway-admin"]
    <<: *hardening
    networks: [backend]
    mem_limit: 144m
    environment:
      GATEWAY_MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # For audit-anchor and audit-verify, which run as the auditor role and can only read.
      POLICY_AUDITOR_DATABASE_URL: postgresql://policy_auditor:${POLICY_AUDITOR_DB_PASSWORD:?set it in .env}@postgres:5432/${POSTGRES_DB}
      # For approver-add, -rotate and -remove: the change is appended to the audit log as the gateway
      # role (agent-core refuses an append from the owner, which owns the table).
      POLICY_GATEWAY_DATABASE_URL: postgresql://policy_gateway:${POLICY_GATEWAY_DB_PASSWORD:?set it in .env}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  # A person's tool for writes that wait for approval. Each approver has a database login of their
  # own (`docker compose run --rm admin approver-add --name "..."` prints it once), and the tool
  # reads who they are from that login: there is no --as to claim. Sign in with
  #   docker compose run --rm -e APPROVER_LOGIN -e APPROVER_PASSWORD approver list
  # or leave the two variables out to be asked. The URL below names the database and no login: no
  # shared approver password exists. The login is a member of the approver role, which can decide
  # requests and read the arguments, and can do nothing else.
  approver:
    profiles: [tools]
    build: *gateway-build
    image: ai-gateway-gateway
    entrypoint: ["gateway-approver"]
    <<: *hardening
    networks: [backend]
    mem_limit: 96m
    environment:
      POLICY_APPROVER_DATABASE_URL: postgresql://postgres:5432/${POSTGRES_DB}
      # Passed through from your shell when set (never from .env), else the tool asks.
      APPROVER_LOGIN:
      APPROVER_PASSWORD:
      APPROVAL_ROLES_FILE: /app/config/approval_roles.toml
    stdin_open: true
    depends_on:
      postgres:
        condition: service_healthy

  # The lab approver, for Phase 6's red-team runs: approves every pending write automatically.
  # Off unless asked for twice: the `lab` profile, and LAB_AUTO_APPROVE=yes in the environment (the
  # service exits at once without it); it also needs the lab database role, which exists only when
  # POLICY_LAB_APPROVER_DB_PASSWORD is set for `policy-setup`, which also records the lab approver
  # (id lab-approver) as the approver that login is.
  # Compose interpolates every service's variables whatever the profile, so none is marked
  # required here: the service itself refuses to run without the flag.
  # Never use it against anything real: it defeats approval.
  lab-approver:
    profiles: [lab]
    build: *gateway-build
    image: ai-gateway-gateway
    entrypoint: ["/app/.venv/bin/python", "/lab/lab_approver.py"]
    restart: "no"
    <<: *hardening
    networks: [backend]
    mem_limit: 96m
    environment:
      POLICY_APPROVER_DATABASE_URL: postgresql://policy_lab_approver:${POLICY_LAB_APPROVER_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB}
      # The product's roles by default; the scorecard points it at the lab roles (the lab upstream's write).
      APPROVAL_ROLES_FILE: ${LAB_APPROVAL_ROLES_FILE_IN_CONTAINER:-/app/config/approval_roles.toml}
      LAB_AUTO_APPROVE: ${LAB_AUTO_APPROVE:-}
      LAB_APPROVER_ID: ${LAB_APPROVER_ID:-lab-approver}
      # approve (the worst case) or reject (the scorecard's idealised approver).
      LAB_APPROVER_DECISION: ${LAB_APPROVER_DECISION:-approve}
    volumes:
      - ./scripts/auto_approver.py:/lab/auto_approver.py:ro
      - ./scripts/lab_approver.py:/lab/lab_approver.py:ro
      # The lab roles file (the lab upstream's write), for the scorecard: read-only, lab config only.
      - ./config/lab:/app/config/lab:ro
    depends_on:
      policy-setup:
        condition: service_completed_successfully

  # Runs scripts/test_client.py in the servers' own network. The servers publish no port, so
  # the host cannot call them directly; scripts/direct_check.sh runs this once per server.
  direct-check:
    profiles: [tools]
    build: *servers-build
    image: harborline-servers
    entrypoint: ["python", "/scripts/test_client.py"]
    <<: *hardening
    networks: [backend]
    mem_limit: 128m
    environment:
      TICKETING_SERVICE_TOKEN: ${TICKETING_SERVICE_TOKEN:?set it in .env}
      CRM_SERVICE_TOKEN: ${CRM_SERVICE_TOKEN:?set it in .env}
      HANDBOOK_SERVICE_TOKEN: ${HANDBOOK_SERVICE_TOKEN:?set it in .env}
    volumes:
      # Only the client and its scenarios: not the rest of scripts/ (the test approver among them).
      - ./scripts/test_client.py:/scripts/test_client.py:ro
      - ./scripts/scenarios:/scripts/scenarios:ro
    depends_on:
      ticketing:
        condition: service_healthy
      crm:
        condition: service_healthy
      handbook:
        condition: service_healthy

  echo:
    profiles: [test]
    build:
      context: .
      dockerfile: servers/echo/Dockerfile
    environment:
      ECHO_HOST: 0.0.0.0
      ECHO_PORT: "8000"
      ECHO_ALLOWED_HOSTS: echo:*,127.0.0.1:*
    <<: *hardening
    networks: [backend]
    mem_limit: 96m

  # The lab upstream of Phase 6's red-team scorecard: a deliberately lenient MCP server whose tool
  # definitions change between phases (a rug pull, unreviewed tools). TEST TOOLING, fenced like the lab
  # approver and asked for three times: the `lab` profile; LAB_MUTABLE_UPSTREAM=yes in the environment
  # (the server exits at once without it); and a credential, LAB_UPSTREAM_TOKEN, given for the run
  # (empty by default, and the server refuses to start with an empty or weak one). It is in no default
  # service, no default image and no `.env.example` value; it sits on the internal network and
  # publishes nothing on the host (the scorecard runner reaches it from inside the network).
  # Compose interpolates every service's variables whatever the profile, so none is marked required
  # here: the server itself refuses to run without them.
  # Never use it against anything real: it accepts what its own schema forbids, on purpose.
  lab-upstream:
    profiles: [lab]
    build:
      context: .
      dockerfile: servers/lab/Dockerfile
    image: ai-gateway-lab-upstream
    restart: "no"
    <<: *hardening
    networks: [backend]
    mem_limit: 96m
    environment:
      LAB_BIND: 0.0.0.0
      LAB_PORT: "4413"
      LAB_ALLOWED_HOSTS: lab-upstream:*,127.0.0.1:*
      LAB_MUTABLE_UPSTREAM: ${LAB_MUTABLE_UPSTREAM:-}
      LAB_PHASE: ${LAB_UPSTREAM_PHASE:-reviewed}
      LAB_SERVICE_TOKEN: ${LAB_UPSTREAM_TOKEN:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4413/healthz", timeout=3)
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  edge: {}
  # The dashboard's own: it and Postgres, nothing else, so the dashboard cannot reach the gateway or the
  # servers. A published port cannot come from an internal network, so this one has a route out;
  # the dashboard holds only the telemetry reader's credential and has no use for it.
  dashboard: {}
  backend:
    internal: true
    driver_opts:
      # No address for the host on this bridge, so a container cannot reach the host's own
      # listeners (SSH, any service bound to 0.0.0.0) through the bridge address.
      com.docker.network.bridge.inhibit_ipv4: "true"

volumes:
  postgres-data:
