name: ai-gateway

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
      GATEWAY_APP_DB_PASSWORD: ${GATEWAY_APP_DB_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:4402:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ai-gateway-gateway
    command: ["gateway-admin", "migrate"]
    environment:
      GATEWAY_MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ai-gateway-gateway
    command: ["ai-gateway"]
    environment:
      GATEWAY_BIND: 0.0.0.0
      GATEWAY_PORT: "4401"
      GATEWAY_DATABASE_URL: postgresql://gateway_app:${GATEWAY_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GATEWAY_PIPELINE_FILE: ${GATEWAY_PIPELINE_FILE_IN_CONTAINER:-/app/config/pipeline.toml}
      GATEWAY_ALLOWED_HOSTS: ${GATEWAY_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:4401:4401"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4401/healthz", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *hardening

  admin:
    profiles: [tools]
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ai-gateway-gateway
    entrypoint: ["gateway-admin"]
    environment:
      GATEWAY_MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  echo:
    profiles: [test]
    build:
      context: .
      dockerfile: servers/echo/Dockerfile
    environment:
      ECHO_HOST: 0.0.0.0
      ECHO_PORT: "8000"
      ECHO_ALLOWED_HOSTS: echo:*,127.0.0.1:*
    <<: *hardening

volumes:
  postgres-data:
