[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "echo-server"
version = "0.2.0"
description = "Test-fixture MCP server used by the gateway test suite."
authors = [{ name = "AOX LLC" }]
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "uvicorn>=0.54,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/echo_server"]
