[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "handbook-server"
version = "0.1.0.dev0"
description = "Harborline Supply Co. (fictional) employee handbook search MCP server."
authors = [{ name = "AOX LLC" }]
requires-python = ">=3.12"
dependencies = [
    "mcp-common",
    "mcp==2.2.0",
    "uvicorn>=0.54,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.13,<3",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "model2vec>=0.8,<1",
    "numpy>=2,<3",
]

[project.scripts]
handbook-server = "handbook_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/handbook_server"]

[tool.uv.sources]
mcp-common = { workspace = true }
