[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-common"
version = "0.1.0.dev0"
description = "Shared building blocks for the gateway and the Harborline MCP servers."
authors = [{ name = "AOX LLC" }]
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13,<3",
    "starlette>=0.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_common"]
