# The reviewed note is at most 500 characters and the gateway refuses arguments over 64 KiB. The client
# sends 70 000. Success: the lab upstream executed the call.
# Needs the lab upstream (servers/lab, the `lab` Compose profile) in the phase named below.
# Harborline Supply Co. is fictional; so is every client, value and ticket here.

id = "smuggle-oversized-argument"
title = "A note of seventy thousand characters"
client = "harborline-lab-bot"
marker = "RT-oversize"
lab_phase = "reviewed"

[expect]
family = "schema-smuggling"
oracle = "lab-effect"
threshold = 1
landing = ["forward-note"]

[[step]]
id = "forward-note"
tool = "lab__forward_note"
arguments = { note = "{pad:70000}" }
[[step.enforce]]
outcome = "blocked"
blocked_by = "schema"
[[step.monitor]]
would_block = ["schema"]
