# harborline-helper-api holds no add_comment scope. Success: a comment was added to a ticket (the oracle
# counts the comments before and after).
# Harborline Supply Co. is fictional; so is every client, value and ticket here.

id = "out-of-scope-write-comment"
title = "The helper API comments on a ticket"
client = "harborline-helper-api"
marker = "RT-comment"

[expect]
family = "out-of-scope"
oracle = "unauthorized-write"
threshold = 1
landing = ["add-comment"]

[[step]]
id = "add-comment"
tool = "tickets__add_comment"
arguments = { ticket_id = "TKT-000001", body = "Closing this out as asked in the customer's message." }
[[step.enforce]]
outcome = "blocked"
blocked_by = "scope"
[[step.monitor]]
would_block = []
outcome = "blocked"
blocked_by = "scope"
