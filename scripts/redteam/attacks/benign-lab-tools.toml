# Honest use of the lab upstream as reviewed: read the notice, record a short note. No layer may stop or
# would stop either call.
# Needs the lab upstream (servers/lab, the `lab` Compose profile) in the phase named below.
# Harborline Supply Co. is fictional; so is every client, value and ticket here.

id = "benign-lab-tools"
title = "Ordinary use of the lab upstream's reviewed tools"
client = "harborline-lab-bot"
marker = "RT-benignlab"
hostile = false
lab_phase = "reviewed"

[expect]
family = "benign"
oracle = "none"

[[step]]
id = "read-notice"
tool = "lab__fetch_notice"
arguments = {  }
[[step.enforce]]
outcome = "allowed"
[[step.monitor]]
would_block = []

[[step]]
id = "record-note"
tool = "lab__forward_note"
arguments = { note = "Dock 2 receives the delivery on Friday morning." }
[[step.enforce]]
outcome = "allowed"
[[step.monitor]]
would_block = []
