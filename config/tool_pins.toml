# The reviewed description and input schema of every tool the gateway offers, pinned.
# A tool that is not here, or whose definition no longer matches, is hidden and refused
# by the pinned_descriptions layer. Written by scripts/generate_tool_pins.py: review it.
# Harborline Supply Co. is fictional.

[tools."crm__get_account"]
sha256 = "b2cc0015be76fc003cb56a32a3055d44466b5efbe0134d780e8ff895ad1b1eb2"
description = "Get one account with its contacts, its 10 newest activity notes and the total number of notes."
input_schema = '''
{
  "additionalProperties": false,
  "properties": {
    "account_id": {
      "maxLength": 9,
      "pattern": "^ACC-[0-9]{5}$",
      "title": "Account Id",
      "type": "string"
    }
  },
  "required": [
    "account_id"
  ],
  "title": "GetAccountInput",
  "type": "object"
}
'''

[tools."crm__list_deals"]
sha256 = "dadf6476b98fe8fd75cb47455916664d4357376923c719205c6866855152eb31"
description = "List deals, newest close date first, optionally for one account or in one stage. Amounts are in cents."
input_schema = '''
{
  "additionalProperties": false,
  "properties": {
    "account_id": {
      "anyOf": [
        {
          "maxLength": 9,
          "pattern": "^ACC-[0-9]{5}$",
          "type": "string"
        },
        {
          "type": "null"
        }
      ],
      "default": null,
      "title": "Account Id"
    },
    "limit": {
      "default": 10,
      "maximum": 20,
      "minimum": 1,
      "title": "Limit",
      "type": "integer"
    },
    "offset": {
      "default": 0,
      "maximum": 10000,
      "minimum": 0,
      "title": "Offset",
      "type": "integer"
    },
    "stage": {
      "anyOf": [
        {
          "enum": [
            "prospecting",
            "proposal",
            "negotiation",
            "won",
            "lost"
          ],
          "type": "string"
        },
        {
          "type": "null"
        }
      ],
      "default": null,
      "title": "Stage"
    }
  },
  "title": "ListDealsInput",
  "type": "object"
}
'''

[tools."crm__search_accounts"]
sha256 = "0a3d92029f0b1a7b00ae7762129a71c06b364ca912facba3a39023e46a8daad6"
description = "Search accounts by words in the name, industry or description, optionally narrowed by tier or region. Returns up to 20 summaries; use offset to reach more."
input_schema = '''
{
  "additionalProperties": false,
  "properties": {
    "limit": {
      "default": 10,
      "maximum": 20,
      "minimum": 1,
      "title": "Limit",
      "type": "integer"
    },
    "offset": {
      "default": 0,
      "maximum": 10000,
      "minimum": 0,
      "title": "Offset",
      "type": "integer"
    },
    "query": {
      "maxLength": 100,
      "minLength": 2,
      "pattern": "^[^\\x00-\\x1f\\x7f-\\x9f]*$",
      "title": "Query",
      "type": "string"
    },
    "region": {
      "anyOf": [
        {
          "enum": [
            "northeast",
            "mid-atlantic",
            "southeast",
            "great-lakes",
            "gulf-coast",
            "pacific-northwest"
          ],
          "type": "string"
        },
        {
          "type": "null"
        }
      ],
      "default": null,
      "title": "Region"
    },
    "tier": {
      "anyOf": [
        {
          "enum": [
            "bronze",
            "silver",
            "gold"
          ],
          "type": "string"
        },
        {
          "type": "null"
        }
      ],
      "default": null,
      "title": "Tier"
    }
  },
  "required": [
    "query"
  ],
  "title": "SearchAccountsInput",
  "type": "object"
}
'''

[tools."handbook__get_document"]
sha256 = "d49e5583751895ca91e39f0adbc8fda138835029bdc611b517d62a4aaa2abfd3"
description = "Get one handbook document by id (for example DOC-001): its title, category, date and full text. If it has been superseded, superseded_by names the current edition."
input_schema = '''
{
  "additionalProperties": false,
  "properties": {
    "document_id": {
      "maxLength": 7,
      "pattern": "^DOC-[0-9]{3}$",
      "title": "Document Id",
      "type": "string"
    }
  },
  "required": [
    "document_id"
  ],
  "title": "GetDocumentInput",
  "type": "object"
}
'''

[tools."handbook__search"]
sha256 = "15c7d7601819098568b17e92a61e4a31c0d714bfdfbe2a4637e5f072ff8ad739"
description = "Search the handbook by meaning and keywords, optionally within one category. Returns up to 10 current documents, each with its best-matching passage, best first."
input_schema = '''
{
  "additionalProperties": false,
  "properties": {
    "category": {
      "anyOf": [
        {
          "enum": [
            "hr",
            "returns",
            "shipping",
            "security",
            "expenses"
          ],
          "type": "string"
        },
        {
          "type": "null"
        }
      ],
      "default": null,
      "title": "Category"
    },
    "limit": {
      "default": 5,
      "maximum": 10,
      "minimum": 1,
      "title": "Limit",
      "type": "integer"
    },
    "query": {
      "maxLength": 200,
      "minLength": 2,
      "pattern": "^[^\\x00-\\x1f\\x7f-\\x9f]*$",
      "title": "Query",
      "type": "string"
    }
  },
  "required": [
    "query"
  ],
  "title": "SearchInput",
  "type": "object"
}
'''

